name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Testy poradia elementov (pohodaXml.test.ts) čítajú oficiálne XSD schémy
      # POHODY. Sú vendorované a gitignorované (agent/vendor/pohoda-xsd/, 1,3 MB
      # od Stormware), takže v čistom checkoute chýbajú a `npm test` padal na
      # ENOENT — CI bola preto červená od zavedenia tých testov.
      - shell: pwsh
        run: ./agent/scripts/fetch-pohoda-xsd.ps1
      - run: npm test
      - run: npm run build
      - run: docker build -t dokladovka:${{ github.sha }} .
